<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="app-version" content="v2026.07.14.v1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1f4e">
<title>ENTRIX – Quotation App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--navy:#0a1f4e;--blue:#1a3a7c;--gold:#e8a020;--gold2:#f5c518;--green:#1a6b3a;--wa:#25d366;--red:#c04040;--purple:#6a0dad;--bg:#f0f4fa;--bd:#dce5f5}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#1a2540;font-size:15px;min-height:100vh}

/* ── LOGIN ── */
#loginScreen{position:fixed;inset:0;background:linear-gradient(150deg,#061228 0%,#0d2550 50%,#1a3a7c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px}
.login-logo{width:72px;height:72px;background:var(--gold);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--navy);margin-bottom:10px;box-shadow:0 8px 32px rgba(232,160,32,.4)}
.login-title{color:#fff;font-size:24px;font-weight:800;letter-spacing:1.5px}
.login-sub{color:#7aa4e8;font-size:11px;letter-spacing:2px;margin-bottom:30px;text-transform:uppercase}
.role-cards{display:flex;gap:14px;margin-bottom:22px;width:100%;max-width:360px}
.role-card{flex:1;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;transition:all .2s}
.role-card.selected{background:rgba(232,160,32,.18);border-color:var(--gold)}
.role-icon{font-size:30px;margin-bottom:7px}
.role-name{color:#fff;font-weight:700;font-size:15px}
.role-desc{color:#7aa4e8;font-size:11px;margin-top:3px}
.login-box{width:100%;max-width:360px}
.login-box input{width:100%;padding:13px 16px;border:2px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-size:15px;outline:none;margin-bottom:12px;font-family:inherit}
.login-box input:focus{border-color:var(--gold)}
.login-box input::placeholder{color:rgba(255,255,255,.4)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#e8a020,#c47a10);color:var(--navy);border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.5px}
.login-err{color:#ff8080;font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#0a1f4e,#1a3a7c);padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:100}
.hdr-logo{width:38px;height:38px;min-width:38px;background:var(--gold);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:var(--navy)}
.hdr-name{color:#fff;font-weight:800;font-size:15px;line-height:1.2}
.hdr-sub{color:#8eb4ff;font-size:10px;letter-spacing:1px}
.role-pill{margin-left:auto;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-admin{background:rgba(232,160,32,.2);border:1px solid var(--gold);color:var(--gold)}
.pill-user{background:rgba(29,184,122,.2);border:1px solid #1db87a;color:#1db87a}
.exit-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;margin-left:6px}

/* ── TABS ── */
.tabs{background:#fff;border-bottom:1px solid var(--bd);display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:none;border-bottom:3px solid transparent;padding:11px 13px;font-size:13px;font-weight:700;cursor:pointer;background:transparent;color:#7a8fb0;white-space:nowrap;transition:all .15s}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* ── LAYOUT ── */
.wrap{max-width:700px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.ct{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;padding-bottom:7px;border-bottom:2px solid var(--gold)}
label{display:block;font-size:11px;font-weight:700;color:#5a6a8a;letter-spacing:.7px;text-transform:uppercase;margin-bottom:4px;margin-top:10px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d0d9ee;border-radius:7px;font-size:14px;color:#1a2540;background:#fff;outline:none;-webkit-appearance:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ifl{display:flex;gap:6px;align-items:center}

/* ── MARGIN BANNER ── */
.mb{background:linear-gradient(135deg,#fff8e0,#fff3c0);border:2px solid var(--gold);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.mb-title{font-weight:800;color:#8a5a00;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.mb-row{display:flex;align-items:center;gap:10px}
.mb-row input[type=range]{flex:1;accent-color:var(--gold)}
.mb-num{width:58px;padding:6px 8px;border:2px solid var(--gold);border-radius:6px;font-weight:800;font-size:14px;text-align:center;color:#8a5a00}

/* ── ITEM CARD ── */
.item-card{background:#f7f9ff;border:1.5px solid var(--bd);border-radius:10px;padding:13px;margin-bottom:10px;position:relative}
.item-badge{position:absolute;top:11px;right:11px;background:var(--blue);color:#fff;border-radius:5px;padding:2px 9px;font-size:11px;font-weight:700}
.custom-card{background:#faf5ff;border:1.5px solid #c084fc}
/* price master picker */
.pm-picker{background:#1a3a7c;border-radius:9px;padding:12px 13px;margin-bottom:10px}
.pm-picker-title{color:#e8a020;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:5px}
/* searchable dropdown */
.pm-search-wrap{position:relative}
.pm-search-input{width:100%;padding:10px 36px 10px 12px;border:2px solid #e8a020;border-radius:7px;background:#0a1f4e;color:#fff;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box}
.pm-search-input::placeholder{color:rgba(255,255,255,.45)}
.pm-search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#e8a020;font-size:18px;cursor:pointer;padding:0;line-height:1}
.pm-dropdown{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#0d2550;border:2px solid #e8a020;border-radius:8px;max-height:260px;overflow-y:auto;z-index:9999;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.pm-dropdown::-webkit-scrollbar{width:5px}
.pm-dropdown::-webkit-scrollbar-thumb{background:#e8a020;border-radius:3px}
.pm-cat-header{padding:5px 12px;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#e8a020;background:#061228;position:sticky;top:0}
.pm-option{padding:10px 14px;font-size:13px;color:#fff;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.06);transition:background .1s}
.pm-option:hover,.pm-option.active{background:rgba(232,160,32,.2)}
.pm-option-name{font-weight:600;line-height:1.3}
.pm-no-result{padding:16px;text-align:center;color:rgba(255,255,255,.4);font-size:13px}
.pm-optgroup-hdr{background:#0a1f4e;color:#e8a020;font-weight:700}
/* discount box */
.disc-box{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1.5px solid #34d399;border-radius:9px;padding:10px 12px;margin:8px 0}
.disc-title{font-size:11px;font-weight:800;color:#065f46;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.disc-row{display:flex;align-items:center;gap:10px}
.disc-input{width:80px;padding:10px 12px;border:2px solid #34d399;border-radius:8px;font-weight:800;font-size:18px;text-align:center;color:#065f46}
.price-breakdown{background:#fff;border:1px solid #d1fae5;border-radius:8px;padding:9px 12px;font-size:12px;margin-top:6px}
.pb-row{display:flex;justify-content:space-between;padding:2px 0;color:#4b5563}
.pb-row.strike{color:#9ca3af;text-decoration:line-through}
.pb-row.final{font-weight:800;font-size:14px;color:#065f46;border-top:1.5px solid #34d399;margin-top:5px;padding-top:5px}

/* ── QTY BANNER ── */
.qty-box{background:linear-gradient(135deg,#0d2550,#1a3a7c);border-radius:9px;padding:11px 14px;margin:10px 0;display:flex;align-items:center;gap:12px}
.qty-label{color:#8eb4ff;font-size:11px;font-weight:700;letter-spacing:1px;margin:0}
.qty-input{background:rgba(255,255,255,.15);border:2px solid var(--gold);border-radius:8px;color:#fff;font-size:22px;font-weight:900;text-align:center;width:76px;padding:7px 4px}
.qty-hint{color:#8eb4ff;font-size:11px;flex:1;line-height:1.4}

/* ── SOLAR FIELDS ── */
.solar-box{background:#ecfdf5;border:1.5px solid #34d399;border-radius:9px;padding:11px 12px;margin:8px 0}
.solar-box-title{font-size:11px;font-weight:800;color:#065f46;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.solar-box label{color:#065f46}
.solar-box select{border-color:#34d399}

/* ── NA BOX ── */
.na-box{background:#f5f5f5;border:1.5px dashed #ccc;border-radius:9px;padding:10px 14px;margin:8px 0;font-size:12px;color:#aaa;text-align:center}

/* ── COMPONENT TOGGLES ── */
.comp-section{margin:8px 0}
.comp-section-title{font-size:11px;font-weight:700;color:#1a3a7c;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.ctog{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:8px;cursor:pointer;user-select:none;transition:all .15s;font-size:13px;font-weight:600;border:1.5px solid}
.ctog.on{background:#ecfdf5;border-color:#34d399;color:#065f46}
.ctog.off{background:#fff5f5;border-color:#fca5a5;color:#991b1b;opacity:.75}
.ctog .ck{font-size:17px;line-height:1}

/* ── COMP DETAIL ── */
.comp-detail{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:9px 11px;margin-bottom:7px}
.comp-detail label{margin-top:0;color:#1a3a7c}

/* ── SPEC BOX ── */
.spec-box{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #93c5fd;border-radius:8px;padding:9px 12px;margin-top:5px;font-size:11px;color:#1e40af;line-height:1.7}
.prod-img{width:100%;max-height:200px;object-fit:contain;border-radius:8px;background:#f0f4fa;border:1px solid var(--bd);margin-bottom:6px;display:block}
.spec-title{font-weight:800;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#1e3a8a;margin-bottom:4px;display:flex;align-items:center;gap:4px}

/* ── PRICE TAGS ── */
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{padding:4px 9px;border-radius:7px;font-size:11px;font-weight:700}
.tag-cost{background:#dbeafe;color:#1e40af}
.tag-unit{background:#fef3c7;color:#92400e}
.tag-gst{background:#d1fae5;color:#065f46}
.tag-total{background:#dcfce7;color:#14532d}

/* ── TOTALS ── */
.totals-box{background:linear-gradient(135deg,#f0f7ff,#e8f0ff);border:1px solid #93c5fd;border-radius:9px;padding:14px;margin-top:10px}
.tot-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;color:#4b5563}
.tot-grand{display:flex;justify-content:space-between;border-top:2px solid var(--gold);margin-top:8px;padding-top:8px;font-weight:900;font-size:20px;color:var(--blue)}
.tot-words{font-size:11px;color:#6b7280;font-style:italic;margin-top:4px}

/* ── BUTTONS ── */
.btn{border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-navy{background:var(--blue);color:#fff}
.btn-gold{background:linear-gradient(135deg,#e8a020,#c47a10);color:var(--navy)}
.btn-green{background:linear-gradient(135deg,#15803d,#166534);color:#fff}
.btn-wa{background:linear-gradient(135deg,#25d366,#16a34a);color:#fff}
.btn-pdf{background:linear-gradient(135deg,#1e40af,#1e3a8a);color:#fff}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff}
.btn-danger{background:rgba(220,38,38,.1);color:#dc2626;border:1px solid #fca5a5}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-full{width:100%}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}

/* ── PRICE TABLE ── */
.price-section{margin-bottom:16px;border-radius:10px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.07)}
.cat-hdr{padding:9px 14px;color:#fff;font-weight:800;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.ptbl{width:100%;border-collapse:collapse;font-size:13px}
.ptbl th{background:var(--blue);color:#fff;padding:7px 9px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.ptbl td{padding:8px 9px;border-bottom:1px solid #eef0f8;vertical-align:middle}
.ptbl tr:nth-child(even) td{background:#f7f9ff}
.add-form{background:#fffce8;padding:10px 12px;display:flex;flex-direction:column;gap:7px;border-bottom:2px dashed var(--gold)}

/* ── ADMIN PRODUCT CARDS ── */
.prod-cards{display:grid;grid-template-columns:1fr;gap:10px;padding:12px}
.prod-card{background:#fff;border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);transition:box-shadow .15s}
.prod-card:hover{box-shadow:0 3px 14px rgba(0,0,0,.1)}
.prod-card-header{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 13px 8px;border-bottom:1px solid var(--bd);gap:8px}
.prod-card-name{font-weight:700;font-size:14px;color:#1a2540;flex:1;line-height:1.3}
.prod-card-price{font-weight:800;font-size:15px;white-space:nowrap;padding:3px 10px;border-radius:7px;background:#fef3c7;color:#92400e}
.prod-card-desc{padding:8px 13px;font-size:12px;color:#4b5563;line-height:1.65;background:#fafbff}
.prod-card-footer{padding:8px 13px;display:flex;gap:7px;border-top:1px solid var(--bd);background:#f8faff}
.prod-card-num{position:absolute;top:11px;left:-1px;background:var(--blue);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:0 5px 5px 0}
/* Add form card */
.add-card{background:linear-gradient(135deg,#fffce8,#fff8d0);border:2px dashed var(--gold);border-radius:10px;padding:14px;margin:0 12px 12px}
/* Purchase price calculator */
.purchase-calc{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:1.5px solid #34d399;border-radius:9px;padding:10px 12px;margin-top:8px}
.purchase-calc-title{font-size:10px;font-weight:800;color:#065f46;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.calc-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.calc-row label{margin:0;font-size:11px;font-weight:700;color:#065f46;white-space:nowrap;min-width:110px}
.calc-row input{flex:1;min-width:80px;padding:7px 10px;border:1.5px solid #34d399;border-radius:6px;font-size:14px;font-weight:700}
.calc-result{background:#065f46;color:#fff;border-radius:7px;padding:8px 12px;font-size:13px;font-weight:800;text-align:center;margin-top:6px}
.selling-badge{display:inline-block;background:#e8a020;color:#0a1f4e;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:800;margin-left:6px}
.add-card-title{font-weight:800;color:#8a5a00;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.field-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.field-row .f{display:flex;flex-direction:column;gap:4px}
.field-row .f label{margin:0;font-size:10px;font-weight:700;color:#6b7280;letter-spacing:.8px}
.field-row .f-name{flex:3;min-width:160px}
.field-row .f-rate{flex:1;min-width:90px}
.field-row .f-unit{flex:1;min-width:80px}
.field-row .f-maxw{flex:1;min-width:70px}
.prod-view-row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}

/* ── HISTORY ── */
.hist-item{background:#fff;border:1px solid var(--bd);border-radius:9px;padding:12px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px}

/* ── PREVIEW / PRINT ── */
#quote-doc{padding:14px;font-family:Arial,sans-serif;font-size:12px;color:#000}
.doc-hdr{border-bottom:3px solid #0a1f4e;padding-bottom:10px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.doc-co{font-size:19px;font-weight:900;color:#0a1f4e;letter-spacing:.5px}
.doc-addr{font-size:10px;color:#555;line-height:1.55;margin-top:3px}
.doc-badge{background:#e8a020;color:#0a1f4e;font-weight:900;font-size:13px;padding:3px 12px;border-radius:4px;display:inline-block;margin-bottom:3px}
.client-box{background:#f7f9ff;border:1px solid #dce5f5;padding:8px 10px;border-radius:6px;margin-bottom:10px;font-size:12px}
.itbl{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.itbl th{background:#0a1f4e;color:#fff;padding:5px 6px;text-align:left;white-space:nowrap}
.itbl td{padding:5px 6px;border-bottom:1px solid #e0e8f5;vertical-align:top}
.itbl tr:nth-child(even) td{background:#f9fbff}
.totdoc{float:right;width:265px;font-size:12px}
.totdoc-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #ddd}
.totdoc-grand{display:flex;justify-content:space-between;padding:5px 0;font-weight:900;font-size:14px;color:#0a1f4e;border-top:2px solid #e8a020;margin-top:3px}
.clearfix{clear:both}
.terms-box{background:#f7f9ff;border:1px solid #dce5f5;padding:8px 10px;border-radius:5px;font-size:10px;margin-bottom:8px;line-height:1.7}
.bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:10px;margin-bottom:8px}
.footer-bar{background:#0a1f4e;color:#e8a020;font-size:10px;font-weight:700;text-align:center;padding:7px;border-radius:5px}

/* ── SETTINGS ── */
.set-section{background:#fffce8;border:2px solid var(--gold);border-radius:10px;padding:14px;margin-bottom:12px}
/* Export section */
.export-section{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid #34d399;border-radius:12px;padding:16px;margin-bottom:14px}
.import-section{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #3b82f6;border-radius:12px;padding:16px;margin-bottom:14px}
.import-title{font-weight:800;color:#1e3a8a;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.data-code-box{background:#0a1f4e;color:#34d399;font-family:monospace;font-size:11px;padding:10px 12px;border-radius:8px;word-break:break-all;line-height:1.6;margin:10px 0;max-height:100px;overflow-y:auto;user-select:all;-webkit-user-select:all}
.wa-share-btn{background:linear-gradient(135deg,#25d366,#16a34a);color:#fff;border:none;border-radius:9px;padding:13px;font-weight:800;font-size:15px;width:100%;cursor:pointer;font-family:inherit;margin-top:8px}
.import-textarea{width:100%;padding:10px 12px;border:2px solid #3b82f6;border-radius:8px;font-family:monospace;font-size:12px;min-height:80px;resize:vertical;background:#f0f7ff;color:#1e3a8a;box-sizing:border-box}
.export-title{font-weight:800;color:#065f46;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.export-desc{font-size:12px;color:#047857;line-height:1.7;margin-bottom:12px}
.export-step{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;font-size:13px;color:#064e3b}

// Smart price loader: use localStorage if it has data, but merge any NEW items from DP
function loadPrices(){
  var storedVer=localStorage.getItem("ex_dp_version");
  // If version changed → wipe old prices and use fresh DP
  if(storedVer!==DP_VERSION){
    console.log("New data version detected — refreshing prices from file");
    var fresh=JSON.parse(JSON.stringify(DP));
    localStorage.setItem("ex_p",JSON.stringify(fresh));
    localStorage.setItem("ex_dp_version",DP_VERSION);
    return fresh;
  }
  var stored=JSON.parse(localStorage.getItem("ex_p")||"null");
  if(!stored)return JSON.parse(JSON.stringify(DP));
  // Merge any new items from DP into stored
  var merged=JSON.parse(JSON.stringify(stored));
  Object.keys(DP).forEach(function(cat){
    if(!merged[cat])merged[cat]=[];
    var storedIds=merged[cat].map(function(x){return x.id;});
    DP[cat].forEach(function(item){
      if(storedIds.indexOf(item.id)===-1)merged[cat].push(item);
    });
  });
  localStorage.setItem("ex_p",JSON.stringify(merged));
  return merged;
}

  if(!stored)return JSON.parse(JSON.stringify(DC));
  var merged=JSON.parse(JSON.stringify(stored));
  var storedIds=merged.map(function(x){return x.id;});

    if(storedIds.indexOf(item.id)===-1)merged.push(item);
  });

}

    dpBP:"none",dpFB:"none",dpLAQty:0,dpJointQty:0,
    customName:"Designer Pole",customDesc:"",customRate:0,originalRate:0,

function recalcDP(it){
  const rate=dpRates[it.dpMaterial]||55;
  const comps=[];
  (it.dpSecs||[]).forEach((s,i)=>{
    if(!s.on)return;
    const pipes=PIPE_DB[s.cat]||[];
    const p=pipes.find(x=>x.l===s.pipe);
    const len=parseFloat(s.len)||0;
    if(!p||len<=0)return;
    const wt=+(p.k*len).toFixed(3);
    comps.push({name:`${DP_SEC_NAMES[i]}: ${s.cat} ${p.l} × ${len}m`,wt,cost:+(wt*rate).toFixed(2)});
  });
  // All accessories calculated by weight × material rate (no fixed prices)
  const bpObj=getDPBasePlates().find(x=>x.key===it.dpBP);
  if(bpObj&&bpObj.w>0)comps.push({name:`${bpObj.l}`,wt:bpObj.w,cost:+(bpObj.w*rate).toFixed(2)});
  const fbObj=getDPFoundBolts().find(x=>x.key===it.dpFB);
  if(fbObj&&fbObj.w>0)comps.push({name:`${fbObj.l}`,wt:fbObj.w,cost:+(fbObj.w*rate).toFixed(2)});
  if(it.dpLAQty>0){const laWt=+(dpAcc.lightArm.w*it.dpLAQty).toFixed(2);comps.push({name:`Light Arm ×${it.dpLAQty}`,wt:laWt,cost:+(laWt*rate).toFixed(2)});}
  if(it.dpJointQty>0){const jWt=+(dpAcc.jointer.w*it.dpJointQty).toFixed(2);comps.push({name:`Jointer Plate ×${it.dpJointQty}`,wt:jWt,cost:+(jWt*rate).toFixed(2)});}

  const poleWt=+comps.reduce((a,r)=>a+r.wt,0).toFixed(3);
  const poleCost=+comps.reduce((a,r)=>a+r.cost,0).toFixed(2);

  it.dpWeight=poleWt;
  it.dpComponents=comps;
  it.customRate=poleCost;
  it.originalRate=poleCost;
  it.customDesc=comps.length
    ?comps.map(c=>c.name).join(" / ")+` / Material: ${it.dpMaterial} / Powder Coating Finish`
    :`Material: ${it.dpMaterial} / Powder Coating Finish — configure sections below to calculate weight & price`;
}

}

function amtWords(n){const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];function c(x){if(!x)return"";if(x<20)return a[x]+" ";if(x<100)return t[Math.floor(x/10)]+" "+(x%10?a[x%10]+" ":"");if(x<1e3)return a[Math.floor(x/100)]+"Hundred "+(x%100?c(x%100):"");if(x<1e5)return c(Math.floor(x/1000))+"Thousand "+(x%1000?c(x%1000):"");if(x<1e7)return c(Math.floor(x/1e5))+"Lakh "+(x%1e5?c(x%1e5):"");return c(Math.floor(x/1e7))+"Crore "+(x%1e7?c(x%1e7):"");}const r=Math.round(n*100)/100,i=Math.floor(r),d=Math.round((r-i)*100);return c(i).trim()+" Rupees"+(d?" and "+c(d).trim()+" Paise":"")+" Only";}

function calcItem(it){
  const qty=parseInt(it.qty)||1;

  if(it.custom){
    const baseRate=parseFloat(it.customRate)||0;
    // Step 1: Apply profit margin
    const mPct=(parseFloat(it.customMargin)||0)/100;
    const rateWithMargin=Math.round(baseRate*(1+mPct)*100)/100;
    // Step 2: Apply discount on top of margin
    const disc=(parseFloat(it.discount)||0)/100;
    const unitFinal=Math.round(rateWithMargin*(1-disc)*100)/100;
    const discAmt=Math.round(rateWithMargin*disc*qty*100)/100;
    const s=unitFinal*qty;const g=s*(it.gstPct||0)/100;
    return{unit:unitFinal,rateWithMargin,qty,sub:s,gst:g,trans:0,total:s+g,
           base:baseRate,discAmt,discPct:parseFloat(it.discount)||0,mPct:parseFloat(it.customMargin)||0};
  }

  // Standard item
  const ub=it.useBody!==false,ubat=it.useBat!==false,up=it.usePanel!==false,
        upo=it.usePole===true,ups=it.usePS===true,
        ufb=it.useFoundBolt===true,uld=it.useLadder===true,upt=it.usePainting===true;
  const base=(ub&&it.bodyId!=="NA"?getRate("bodies",it.bodyId)*(it.bodyQty||1):0)
    +(ubat&&it.batId!=="NA"?getRate("batteries",it.batId)*(it.batQty||1):0)
    +(up&&it.panelId!=="NA"?getRate("panels",it.panelId)*(it.panelQty||1):0)
    +(upo?getRate("poles",it.poleId):0)
    +(ups?getRate("structures",it.psId)*(it.psQty||1):0)
    +(ufb?getRate("foundation_bolt",it.foundBoltId)*(it.foundBoltQty||1):0)
    +(it.useLA===true&&it.laId!=="NA"?getRate("light_arm",it.laId)*(it.laQty||1):0)
    +(uld?getRate("ladder",it.ladderId):0)
    +(upt?getRate("painting",it.paintingId):0);

  // Step 1: Apply margin
  const m=(it.margin!=null?parseFloat(it.margin):gMargin)/100;
  const warr=isSolar(it.type)?((it.warranty===2?1.1:it.warranty===3?1.21:1)):1;
  const unit=Math.round(base*(1+m)*warr);

  // Step 2: Apply discount
  const disc2=(parseFloat(it.stdDisc)||0)/100;
  const unitAfterDisc=Math.round(unit*(1-disc2)*100)/100;
  const sub=unitAfterDisc*qty;const gst=sub*(it.gstPct||0)/100;
  return{unit,unitAfterDisc,qty,sub,gst,trans:0,total:sub+gst,base,stdDisc:parseFloat(it.stdDisc)||0};
}
const getTotals=()=>{
  const base=items.reduce((a,it)=>{const c=calcItem(it);a.sub+=c.sub;a.gst+=c.gst;a.grand+=c.total;return a;},{sub:0,gst:0,grand:0});
  const tAmt=parseFloat(quoteTransport.amount)||0;
  const tGst=tAmt*(parseFloat(quoteTransport.gstPct)||0)/100;
  const trans=tAmt+tGst;
  return{sub:base.sub,gst:base.gst,trans,transAmt:tAmt,transGst:tGst,grand:base.grand+trans};
};

var clientData={quoteNo:"",quoteDate:"",validDate:"",docType:"Quotation",cName:"",cAddr:"",cCity:"",cContact:"",cPerson:"",cGstin:"",remarks:""};

function saveClientData(){
  ["quoteNo","quoteDate","validDate","docType","cName","cAddr","cCity","cContact","cPerson","cGstin","remarks"].forEach(function(k){
    var el=document.getElementById(k);
    if(el)clientData[k]=el.value;
  });

function restoreClientData(){
  Object.keys(clientData).forEach(function(k){
    var el=document.getElementById(k);
    if(el&&clientData[k])el.value=clientData[k];
  });
}

function showTab(t){
  // Save client data before switching away from quote tab
  if(document.getElementById("tab-quote")&&document.getElementById("tab-quote").style.display!=="none"){
    saveClientData();
  }
  document.querySelectorAll("[id^=tab-]").forEach(e=>e.style.display="none");
  document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"));
  document.getElementById("tab-"+t).style.display="";
  const tb=document.getElementById("tb_"+t);if(tb)tb.classList.add("active");
  if(t==="quote"){renderQuoteTab();setTimeout(restoreClientData,30);}
  else if(t==="prices")renderPricesTab();

  else if(t==="preview"){saveClientData();renderPreview();}

  const rec=getAutoRec(it.wattage,it.dimming);it.batId=rec.bat;it.panelId=rec.panel;
  return it;
}

function addCustomItem(){items.push({id:uid(),custom:true,priceMasterId:"",priceMasterCat:"",catalogId:"",customName:"",customDesc:"",customRate:"",originalRate:0,customMargin:0,discount:0,qty:1,gstPct:18,transport:0});renderItems();}
function removeItem(id){items=items.filter(x=>x.id!==id);renderItems();}

function updField(id,field,val){
  const it=items.find(x=>x.id===id);if(!it)return;
  it[field]=val;
  if(field==="wattage"||field==="dimming"){const rec=getAutoRec(Number(field==="wattage"?val:it.wattage),field==="dimming"?val:it.dimming);it.batId=rec.bat;it.panelId=rec.panel;}
  if(field==="type"){
    if(!isSolar(val)){it.dimming="2stage";it.warranty=1;}
    if(val==="POLE"){it.useBody=false;it.useBat=false;it.usePanel=false;it.usePole=true;it.usePS=false;it.gstPct=18;}
    else if(val==="SSL"||val==="SHM"){it.useBody=true;it.useBat=true;it.usePanel=true;it.gstPct=5;}
    else if(val==="LED"){it.useBody=true;it.useBat=false;it.usePanel=false;it.usePole=false;it.gstPct=18;}
  }
  if(field==="catalogId"){
    const cp=catalog.find(x=>x.id===val);
    if(cp){it.customName=cp.name;it.customDesc=cp.desc;if(!it.customRate||it.customRate==0){it.customRate=cp.rate;it.originalRate=cp.rate;}}
  }
  if(field==="priceMasterId"){
    if(!val){it.priceMasterCat="";it.customName="";it.customDesc="";it.customRate="";it.originalRate=0;return;}
    // Search all price categories
    let found=null,foundCat="";
    for(const cat of Object.keys(prices)){
      const item=(prices[cat]||[]).find(x=>x.id===val);
      if(item){found=item;foundCat=cat;break;}
    }
    if(found){
      it.priceMasterCat=foundCat;
      it.customName=found.label;
      const desc=found.desc||((SPECS[foundCat]&&SPECS[foundCat][found.id]))||"";
      it.customDesc=desc;
      it.customRate=found.rate||0;
      it.originalRate=found.rate||0;
      it.discount=0;
    }
  }
  renderItems();
}
function toggleComp(id,field){
  const it=items.find(x=>x.id===id);if(!it)return;
  const defOff=field==="usePole"||field==="usePS";
  if(it[field]===undefined)it[field]=defOff;
  it[field]=!it[field];
  renderItems();
}

// Returns flat array of all products for search
function getPriceMasterAll(){
  const all=[];
  Object.entries(prices).forEach(([cat,items])=>{
    if(!items||!items.length)return;
    const catLabel=(CAT_ICO[cat]||"")+" "+(CAT_LBL[cat]||cat);
    items.forEach(it=>all.push({id:it.id,name:it.label,cat,catLabel,source:"prices"}));
  });
  catalog.forEach(cp=>all.push({id:cp.id,name:cp.name,cat:"catalog",catLabel:"⚙️ Custom Catalog",source:"catalog"}));
  return all;
}

function filterPriceMaster(query,filterCat){
  let all=getPriceMasterAll();
  if(filterCat&&filterCat!=="all"){
    all=all.filter(x=>x.cat===filterCat);
  }
  if(!query.trim())return all;
  const q=query.toLowerCase();
  return all.filter(x=>x.name.toLowerCase().includes(q)||x.catLabel.toLowerCase().includes(q));
}

function renderPMDropdown(itemId,query,selectedId){
  const catEl=document.getElementById("pmCat_"+itemId);
  const filterCat=catEl?catEl.value:"all";
  const results=filterPriceMaster(query,filterCat);
  const dd=document.getElementById("pmDrop_"+itemId);
  if(!dd)return;
  if(!results.length){
    dd.innerHTML='<div class="pm-no-result">No products found'+(query?` for "<b>${query}</b>"`:"")+'</div>';
    return;
  }
  const groups={};
  results.forEach(r=>{if(!groups[r.catLabel])groups[r.catLabel]=[];groups[r.catLabel].push(r);});
  dd.innerHTML=Object.entries(groups).map(([grp,items])=>
    `<div class="pm-cat-header">${grp}</div>`+
    items.map(r=>`<div class="pm-option${r.id===selectedId?" active":""}" onclick="selectPMItem('${itemId}','${r.id}')">
      <div class="pm-option-name">${r.name}</div>
    </div>`).join("")
  ).join("");
}

function onPMCatChange(itemId){
  const searchEl=document.getElementById("pmSearch_"+itemId);
  const query=searchEl?searchEl.value:"";
  const it=items.find(x=>x.id===itemId);
  showPMDrop(itemId);
  renderPMDropdown(itemId,query,it?it.priceMasterId||it.catalogId:"");
}

function selectPMItem(itemId,prodId){
  // Save selected category BEFORE updField triggers renderItems
  const it=items.find(x=>x.id===itemId);
  const catEl=document.getElementById("pmCat_"+itemId);
  const savedCat=catEl?catEl.value:(it?it._pmCat:"all");
  if(it&&savedCat)it._pmCat=savedCat;

  // Update the search input to show selected name
  const all=getPriceMasterAll();
  const prod=all.find(x=>x.id===prodId);
  const inp=document.getElementById("pmSearch_"+itemId);
  if(inp&&prod)inp.value=prod.name;
  hidePMDrop(itemId);
  updField(itemId,"priceMasterId",prodId);
  // _pmCat is stored on item so it persists through renderItems ✅
}

function showPMDrop(itemId){
  const dd=document.getElementById("pmDrop_"+itemId);
  if(dd)dd.style.display="";
}
function hidePMDrop(itemId){
  const dd=document.getElementById("pmDrop_"+itemId);
  if(dd)dd.style.display="none";
}
function onPMSearchInput(itemId,query){
  showPMDrop(itemId);
  const it=items.find(x=>x.id===itemId);
  renderPMDropdown(itemId,query,it?it.priceMasterId||it.catalogId:"");
}
function clearPMSearch(itemId){
  const inp=document.getElementById("pmSearch_"+itemId);
  if(inp)inp.value="";
  const it=items.find(x=>x.id===itemId);
  const catEl=document.getElementById("pmCat_"+itemId);
  const savedCat=catEl?catEl.value:(it?it._pmCat:"all");
  if(it){it.priceMasterId="";it.priceMasterCat="";it.catalogId="";}
  if(it&&savedCat)it._pmCat=savedCat;
  const dd=document.getElementById("pmDrop_"+itemId);
  if(dd){renderPMDropdown(itemId,"",savedCat||"all");dd.style.display="";}
}

// Close dropdown when clicking outside
document.addEventListener("click",function(e){
  document.querySelectorAll("[id^='pmDrop_']").forEach(dd=>{
    const itemId=dd.id.replace("pmDrop_","");
    const wrap=document.getElementById("pmWrap_"+itemId);
    if(wrap&&!wrap.contains(e.target))dd.style.display="none";
  });
});

function syncStdDisc(itemId,val){
  const it=items.find(x=>x.id===itemId);if(!it)return;
  it.stdDisc=parseFloat(val)||0;
  // Sync slider and number without re-rendering
  const ss=document.getElementById("stdslider_"+itemId);
  const sn=document.getElementById("stdnum_"+itemId);
  if(ss&&document.activeElement!==ss)ss.value=it.stdDisc;
  if(sn&&document.activeElement!==sn)sn.value=it.stdDisc;
  // Update price display in-place
  updateItemDisplay(itemId);
  updateTotals();
}

function syncCustomMargin(itemId,val){
  const it=items.find(x=>x.id===itemId);if(!it)return;
  it.customMargin=parseFloat(val)||0;
  const ms=document.getElementById("cmslider_"+itemId);
  const mn=document.getElementById("cmnum_"+itemId);
  if(ms&&document.activeElement!==ms)ms.value=it.customMargin;
  if(mn&&document.activeElement!==mn)mn.value=it.customMargin;
  updateItemDisplay(itemId);
  updateTotals();
}

function syncDiscount(itemId,val){
  const it=items.find(x=>x.id===itemId);if(!it)return;
  it.discount=parseFloat(val)||0;
  const ds=document.getElementById("dslider_"+itemId);
  const dn=document.getElementById("dnum_"+itemId);
  if(ds&&document.activeElement!==ds)ds.value=it.discount;
  if(dn&&document.activeElement!==dn)dn.value=it.discount;
  updateItemDisplay(itemId);
  updateTotals();
}

// Update price tags and totals for a single item without full re-render
function updateItemDisplay(itemId){
  const it=items.find(x=>x.id===itemId);if(!it)return;
  const calc=calcItem(it);
  // Update total tag
  const totalEl=document.getElementById("itotal_"+itemId);
  if(totalEl){
    if(!it.custom&&!it.isDesignerPole&&role==="admin")totalEl.textContent="✅ Total ("+calc.qty+" sets): "+inr(calc.total);
    else totalEl.textContent="✅ Total: "+inr(calc.total);
  }
  // Update unit price tag
  const unitEl=document.getElementById("iunit_"+itemId);
  if(unitEl){
    if(it.isDesignerPole)unitEl.textContent="💰 "+inr(calc.unit)+"/pole × "+(it.qty||1);
    else if(it.custom)unitEl.textContent="💰 "+inr(calc.unit)+"/unit × "+(it.qty||1);
    else unitEl.textContent="💰 "+inr(calc.unitAfterDisc||calc.unit)+" × "+calc.qty;
  }
  // Update discount info display
  const discEl=document.getElementById("idisc_"+itemId);
  if(discEl){
    const d=it.custom?parseFloat(it.discount)||0:parseFloat(it.stdDisc)||0;
    if(d>0){
      discEl.innerHTML='<span style="color:#dc2626;font-size:11px;font-weight:700">🏷 '+d+'% OFF</span>';
      discEl.style.display="";
    }else{
      discEl.innerHTML="";
    }
  }
  // Update GST tag
  const gstEl=document.getElementById("igst_"+itemId);
  if(gstEl)gstEl.textContent="🧾 GST: "+inr(calc.gst);
  // Update price-breakdown box (custom items with pre-existing sub-ids: ddiscamt_/dtotal_)
  const ddiscEl=document.getElementById("ddiscamt_"+itemId);
  if(ddiscEl)ddiscEl.textContent="-"+inr(calc.discAmt||0);
  const dtotalEl=document.getElementById("dtotal_"+itemId);
  if(dtotalEl)dtotalEl.textContent=inr(calc.total-calc.gst-calc.trans);
  // Update price-breakdown box (std card & designer pole — full-block wrapper ipb_)
  const pbEl=document.getElementById("ipb_"+itemId);
  if(pbEl){
    if(it.isDesignerPole||it.custom){
      const baseRate=parseFloat(it.customRate)||0;
      const disc=parseFloat(it.discount)||0;
      const discAmt=calc.discAmt||0;
      pbEl.innerHTML=baseRate>0?(
        '<div class="price-breakdown">'
        +'<div class="pb-row"><span>Base Rate:</span><span>'+inr(baseRate)+'</span></div>'
        +(disc>0?'<div class="pb-row"><span>Discount ('+disc+'%):</span><span style="color:#dc2626;font-weight:700">-'+inr(discAmt)+'</span></div>':'')
        +'<div class="pb-row final"><span>After Discount × '+(it.qty||1)+':</span><span>'+inr(calc.total-calc.gst-calc.trans)+'</span></div>'
        +'</div>'
      ):"";
    }else{
      const d=parseFloat(it.stdDisc)||0;
      pbEl.innerHTML=d>0?(
        '<div class="price-breakdown">'
        +'<div class="pb-row"><span>Unit Price:</span><span>'+inr(calc.unit)+'</span></div>'
        +'<div class="pb-row"><span>Discount ('+d+'%):</span><span style="color:#dc2626;font-weight:700">-'+inr(Math.round(calc.unit*d/100))+'</span></div>'
        +'<div class="pb-row final"><span>After Discount × '+calc.qty+':</span><span>'+inr(Math.round(calc.unit*(1-d/100))*calc.qty)+'</span></div>'
        +'</div>'
      ):"";
    }
  }
}

function mkSel(cat,sel,isAdmin,addNA){
  const naOpt=addNA?`<option value="NA"${sel==="NA"?" selected":""}>🚫 Not Applicable</option>`:"";
  return naOpt+(prices[cat]||[]).map(x=>`<option value="${x.id}"${x.id===sel?" selected":""}>${x.label}${isAdmin&&x.rate?" — "+inr(x.rate):""}</option>`).join("");
}

function updateTotals(){
  const t=getTotals();
  const s=document.getElementById("tSub"),g=document.getElementById("tGst"),gr=document.getElementById("tGrand"),w=document.getElementById("tWords");
  if(s)s.textContent=inr(t.sub);if(g)g.textContent=inr(t.gst);if(gr)gr.textContent=inr(t.grand);if(w)w.textContent=amtWords(t.grand);
  const tr=document.getElementById("tTransRow");
  if(tr){if(t.trans>0){tr.style.display="";const tt=document.getElementById("tTrans");if(tt)tt.textContent=inr(t.trans);}else tr.style.display="none";}
  // transport preview box
  const tp=document.getElementById("transPreview");
  if(tp){
    if(t.transAmt>0){
      tp.style.display="";
      tp.innerHTML=`🚚 Transport: ${inr(t.transAmt)} + GST (${quoteTransport.gstPct}%): ${inr(t.transGst)} = <b>${inr(t.trans)}</b>`;
    } else {tp.style.display="none";}
  }
}

// ═══ AUTO DESCRIPTION ═══
function buildAutoDesc(it){
  if(it.custom){const d=it.customDesc||it.customName||(it.customName?it.customName:"Custom Item");return d;}
  const parts=[];
  const type=it.type==="SSL"?"Solar Street Light":it.type==="SHM"?"Solar High Mast":it.type==="LED"?"LED Street Light":"Pole Only";
  parts.push(type);
  if(it.type!=="POLE")parts.push(`${it.wattage}W`);
  if(it.useBody!==false&&it.bodyId!=="NA"){const b=(prices.bodies||[]).find(x=>x.id===it.bodyId);if(b)parts.push(`${b.label}${(it.bodyQty||1)>1?' × '+(it.bodyQty||1):''}`)}
  if(it.useBat!==false&&it.batId!=="NA"){const b=(prices.batteries||[]).find(x=>x.id===it.batId);if(b)parts.push(`${b.label} × ${it.batQty||1}`);}
  if(it.usePanel!==false&&it.panelId!=="NA"){const p=(prices.panels||[]).find(x=>x.id===it.panelId);if(p)parts.push(`${p.label} × ${it.panelQty||1}`);}
  if(it.usePole===true&&it.poleId!=="NA"){const p=(prices.poles||[]).find(x=>x.id===it.poleId);if(p)parts.push(p.label);}
  if(it.usePS===true&&it.psId!=="NA"){const p=(prices.structures||[]).find(x=>x.id===it.psId);if(p)parts.push(p.label);}
  if(it.useFoundBolt===true&&it.foundBoltId!=="NA"){const f=(prices.foundation_bolt||[]).find(x=>x.id===it.foundBoltId);if(f)parts.push(f.label);}
  if(it.useLadder===true&&it.ladderId!=="NA"){const l=(prices.ladder||[]).find(x=>x.id===it.ladderId);if(l)parts.push(l.label);}
  if(it.usePainting===true&&it.paintingId!=="NA"){const p=(prices.painting||[]).find(x=>x.id===it.paintingId);if(p)parts.push(p.label);}
  if(it.useLA===true&&it.laId!=="NA"){const la=(prices.light_arm||[]).find(x=>x.id===it.laId);if(la)parts.push(la.label+(it.laQty>1?" ×"+it.laQty:""));}
  if(isSolar(it.type)){const dm={"4stage":"4 Stage","3stage":"3 Stage","2stage":"2 Stage","constant":"Constant (Dusk-Dawn)"};parts.push(dm[it.dimming]||it.dimming);parts.push(`Warranty: ${it.warranty} Year`);}
  return parts.join(" / ");
}

function savePE(ct,id){
  const nl=(document.getElementById("el_"+id)||{}).value.trim();
  const nr=parseFloat((document.getElementById("ev_"+id)||{}).value)||0;
  const nd=(document.getElementById("ed_"+id)||{}).value.trim()||"";
  const nw=document.getElementById("ew_"+id);
  const ncp=parseFloat((document.getElementById("ecp_"+id)||{}).value)||0;
  const ncm=parseFloat((document.getElementById("ecm_"+id)||{}).value)||0;
  const it=prices[ct].find(x=>x.id===id);
  if(!it||!nl){alert("Product name cannot be empty!");return;}
  it.label=nl;it.rate=nr;it.desc=nd;
  if(nw)it.maxW=parseInt(nw.value)||undefined;
  if(ncp>0){it.purchasePrice=ncp;it.marginPct=ncm;}
  if(!SPECS[ct])SPECS[ct]={};
  SPECS[ct][id]=nd;
  savePrices();
  cancelPE(id);
  renderPList();
  showMsg("pMsg","✅ Product updated!","msg-ok");
}

function calcSellingPrice(purchase,margin){
  if(!purchase||purchase<=0)return 0;
  return Math.round(purchase*(1+(parseFloat(margin)||0)/100));
}
function applyCalcRate(ct){
  var p=parseFloat((document.getElementById("acp_"+ct)||{}).value)||0;
  var m=parseFloat((document.getElementById("acm_"+ct)||{}).value)||0;
  var sp=calcSellingPrice(p,m);
  if(sp>0){
    var rEl=document.getElementById("ar_"+ct);
    if(rEl){rEl.value=sp;rEl.style.borderColor="#34d399";}
    // Store purchase price in hidden field
    var cpEl=document.getElementById("acp_"+ct);
    if(cpEl)cpEl.dataset.applied=sp;
  }
}

function onPurchaseChange(purchaseId,marginId,resultId){
  var p=parseFloat((document.getElementById(purchaseId)||{}).value)||0;
  var m=parseFloat((document.getElementById(marginId)||{}).value)||0;
  var sp=calcSellingPrice(p,m);
  var el=document.getElementById(resultId);
  if(el){
    if(p>0){
      el.style.display="";
      el.innerHTML='Selling Price: <b>₹'+sp.toLocaleString("en-IN")+'</b>'
        +(m>0?' <span style="font-size:11px;opacity:.8">(₹'+p.toLocaleString("en-IN")+' + '+m+'% margin)</span>':'');
    }else{
      el.style.display="none";
    }
  }
}

// Push one snapshot to Firestore (non-blocking, silent on failure)
function pushToCloud(snap, cb){
  if(!fbReady){ if(cb)cb(false,"offline"); return; }
  try{
    fbDB.collection("quotations").doc(snap.id).set(snap)
      .then(function(){ if(cb)cb(true,""); })
      .catch(function(e){ if(cb)cb(false, e.message||"write-failed"); });
  }catch(e){ if(cb)cb(false, e.message||"write-error"); }
}

function saveQuoteNew(){
  const snap=buildSnap();
  const all=JSON.parse(localStorage.getItem("ex_h")||"[]");
  all.unshift(snap); if(all.length>60)all.length=60;
  localStorage.setItem("ex_h",JSON.stringify(all));
  const msgEl=document.getElementById("quoteMsg");
  if(msgEl)msgEl.innerHTML='<div class="msg msg-ok">✅ Saved locally… ☁️ syncing to cloud</div>';
  pushToCloud(snap,function(ok,err){
    if(!msgEl)return;
    if(ok){
      msgEl.innerHTML='<div class="msg msg-ok">✅ Saved &amp; synced to team cloud ☁️</div>';
    }else if(err==="offline"){

function saveQuoteForce(){
  const qno=V("quoteNo")||"";
  const snap=buildSnap();
  const all=JSON.parse(localStorage.getItem("ex_h")||"[]");
  const dupIdx=all.findIndex(s=>s.quoteNo===qno);
  if(dupIdx>=0){ snap.id=all[dupIdx].id; all.splice(dupIdx,1); }
  all.unshift(snap); if(all.length>60)all.length=60;
  localStorage.setItem("ex_h",JSON.stringify(all));
  const msgEl=document.getElementById("quoteMsg");
  if(msgEl)msgEl.innerHTML='<div class="msg msg-ok">✅ Updated locally… ☁️ syncing</div>';
  pushToCloud(snap,function(ok,err){
    if(!msgEl)return;
    if(ok) msgEl.innerHTML='<div class="msg msg-ok">✅ Updated &amp; synced to team cloud ☁️</div>';
    else if(err==="offline") msgEl.innerHTML='<div class="msg msg-ok">✅ Updated on this device</div>';
    else msgEl.innerHTML='<div class="msg msg-ok">✅ Updated on device · ⚠️ cloud sync failed</div>';
    setTimeout(function(){ if(msgEl)msgEl.innerHTML=""; },3500);
  });
}
var histView = "mine";      // "mine" | "team"
var teamCache = null;        // cached team quotations
var teamLoading = false;

function setHistView(v){
  histView = v;
  renderHistoryTab();
  if(v === "team" && teamCache === null) fetchTeamQuotes();
}

function fetchTeamQuotes(){
  if(!fbReady){ teamCache = []; renderHistoryTab(); return; }
  teamLoading = true; renderHistoryTab();
  try{
    fbDB.collection("quotations").orderBy("savedAt","desc").limit(300).get()
      .then(function(snapshot){
        var out=[];
        snapshot.forEach(function(doc){ out.push(doc.data()); });
        teamCache = out; teamLoading = false; renderHistoryTab();
      })
      .catch(function(e){
        teamCache = []; teamLoading = false;
        renderHistoryTab(e.message||"read-failed");
      });
  }catch(e){
    teamCache = []; teamLoading = false; renderHistoryTab(e.message||"read-error");
  }
}

function renderHistoryTab(errMsg){
  var t = document.getElementById("tab-history");
  if(!t) return;
  var mine = JSON.parse(localStorage.getItem("ex_h")||"[]");
  var isTeam = (histView === "team");
  var list = isTeam ? (teamCache||[]) : mine;

  // Cloud status pill
  var statusPill = fbReady
    ? '<span style="background:#dcfce7;color:#14532d;font-size:10px;font-weight:800;padding:3px 9px;border-radius:10px">☁️ Cloud Connected</span>'
    : '<span style="background:#fef3c7;color:#92400e;font-size:10px;font-weight:800;padding:3px 9px;border-radius:10px">📴 Local Only</span>';

  // Toggle bar
  var head = '<div class="card" style="padding:12px">'

        +(isTeam?'1.5px solid #d1d5db;background:#fff;color:#6b7280':'none;background:linear-gradient(135deg,#0a1f4e,#1a3a7c);color:#fff')+'">👤 My Quotations</button>'
      +'<button onclick="setHistView(\'team\')" style="flex:1;padding:10px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;border:'
        +(isTeam?'none;background:linear-gradient(135deg,#0f766e,#0e7490);color:#fff':'1.5px solid #d1d5db;background:#fff;color:#6b7280')+'">👥 Team Quotations</button>'
    +'</div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center">'
      +'<b style="color:var(--blue);font-size:14px">🗂 '+list.length+(isTeam?' Team':' My')+' Quotation'+(list.length===1?'':'s')+'</b>'
      +statusPill
    +'</div>';

  // Team totals summary
  if(isTeam && list.length){
    var grand = 0, byPerson = {};
    list.forEach(function(s){
      var v = (s.totals&&s.totals.grand)||0; grand += v;
      var w = s.salesPerson||"Unknown";
      byPerson[w] = (byPerson[w]||0) + v;
    });
    head += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid #e5e7eb">'
      +'<div style="font-size:11px;font-weight:800;color:#0f766e;letter-spacing:.8px;margin-bottom:6px">TEAM TOTAL: '+inr(grand)+'</div>';
    Object.keys(byPerson).sort(function(a,b){return byPerson[b]-byPerson[a];}).forEach(function(w){
      head += '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:#374151">'
        +'<span>👤 '+w+'</span><span style="font-weight:700">'+inr(byPerson[w])+'</span></div>';
    });
    head += '</div>';
  }
  head += '</div>';

  // Body
  var body = "";
  if(isTeam && teamLoading){
    body = '<div class="card empty"><i>☁️</i>Loading team quotations…</div>';
  }else if(isTeam && !fbReady){
    body = '<div class="card" style="background:#fffbeb;border:1.5px solid #f59e0b">'
      +'<div style="font-weight:800;color:#92400e;margin-bottom:6px">☁️ Cloud Not Configured</div>'
      +'<div style="font-size:12px;color:#78350f;line-height:1.7">To share quotations across your sales team, add your Firebase project keys near the top of this file (FIREBASE_CONFIG), then re-upload the app.</div>'
      +'</div>';
  }else if(!list.length){
    body = '<div class="card empty"><i>🗂</i>'+(isTeam?'No team quotations yet.':'No saved quotations yet.<br>Build one and tap 💾 Save.')+'</div>';
  }else{
    body = list.map(function(s){ return histCard(s, isTeam); }).join("");
  }

  if(errMsg && typeof errMsg === "string"){
    body = '<div class="card" style="background:#fef2f2;border:1.5px solid #ef4444;color:#991b1b;font-size:12px">⚠️ '+errMsg+'</div>' + body;
  }

  t.innerHTML = head + body;
}

function exportAppWithPrices(){

  if(msgEl)msgEl.innerHTML="";

  setTimeout(function(){
    try{
      // Get HTML from DOM
      var html=document.documentElement.outerHTML;
      if(html.indexOf("<!DOCTYPE")===-1)html="<!DOCTYPE html>"+html;

      // Replace DP block with current prices
      var dpS=html.indexOf("//<<DP_START>>");
      var dpE=html.indexOf("//<<DP_END>>");
      if(dpS>-1&&dpE>-1){
        var dpMark="//<<DP_START>>";
        var newDP=dpMark+"\nconst DP = "+JSON.stringify(prices)+";";
        html=html.slice(0,dpS)+newDP+html.slice(dpE);
      }

      // Replace DC block with current catalog
      var dcS=html.indexOf("//<<DC_START>>");
      var dcE=html.indexOf("//<<DC_END>>");
      if(dcS>-1&&dcE>-1){
        var dcMark="//<<DC_START>>";
        var newDC=dcMark+"\nconst DC = "+JSON.stringify(catalog)+";";
        html=html.slice(0,dcS)+newDC+html.slice(dcE);
      }

      // Inject pin/margin seed
      var tagO='<'+'script id="epsd">';
      var tagC='<'+'/script>';
      var uc=JSON.parse(localStorage.getItem("ex_user_cats")||"[]");
      var sc='(function(){'
        +'try{'
        +'localStorage.setItem("ex_pin",'+JSON.stringify(adminPin)+');'
        +'localStorage.setItem("ex_m",'+JSON.stringify(String(gMargin))+');'
        +'localStorage.setItem("ex_user_cats",'+JSON.stringify(JSON.stringify(uc))+');'
        +'}catch(e){}'
        +'var s=document.getElementById("epsd");'
        +'if(s&&s.parentNode)s.parentNode.removeChild(s);'
        +'})();';
      var seed=tagO+sc+tagC;
      var os=html.indexOf(tagO);
      if(os>-1){var oe=html.indexOf(tagC,os);if(oe>-1)html=html.slice(0,os)+html.slice(oe+tagC.length);}
      var bi=html.lastIndexOf("</body>");
      if(bi===-1)bi=html.lastIndexOf("</BODY>");
      if(bi>-1)html=html.slice(0,bi)+seed+html.slice(bi);
      else html=html+seed;

      // Create file
      var date=new Date();
      var stamp=date.getFullYear()+""+String(date.getMonth()+1).padStart(2,"0")+""+String(date.getDate()).padStart(2,"0");
      var fileName="index.html";
      var blob=new Blob([html],{type:"text/html;charset=utf-8"});

      if(btn){btn.disabled=false;btn.textContent="📥 Download Updated App File";}

      // ── Try 1: Web Share API (Android share sheet - save to Drive/Files) ──
      if(navigator.share&&navigator.canShare){
        var f=new File([blob],fileName,{type:"text/html"});
        if(navigator.canShare({files:[f]})){
          navigator.share({title:"ENTRIX App - Updated Prices",files:[f]})
            .then(function(){
              showExportSuccess(msgEl);
            })
            .catch(function(e){
              if(e.name!=="AbortError")showBlobLink(blob,fileName,msgEl);
            });
          return;
        }
      }

      // ── Try 2: Direct blob URL link ──
      showBlobLink(blob,fileName,msgEl);

    }catch(err){
      if(btn){btn.disabled=false;btn.textContent="📥 Download Updated App File";}
      showMsg("exportMsg","❌ "+err.message,"msg-err");
    }
  },200);
}

function showBlobLink(blob,fileName,msgEl){
  // Read as text for GitHub upload method + base64 for download link
  var fr=new FileReader();
  fr.onload=function(){
    var dataUrl=fr.result;
    // Also read as text for clipboard method
    var fr2=new FileReader();
    fr2.onload=function(){
      window._htmlContent=fr2.result;
    };
    fr2.onerror=function(){};
    fr2.readAsText(blob);

    if(!msgEl)return;
    msgEl.innerHTML=''
      +'<div style="background:#0a1f4e;border-radius:12px;padding:14px;margin-top:8px">'
      +'<div style="font-weight:800;color:#e8a020;font-size:15px;margin-bottom:12px">✅ File Ready! Choose how to upload:</div>'

      // Option 1: Web Share - best for Android
      +'<div style="background:rgba(255,255,255,.08);border-radius:9px;padding:12px;margin-bottom:10px">'
      +'<div style="color:#8eb4ff;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:6px">OPTION 1 — BEST FOR ANDROID</div>'
      +'<button id="shareBtn" onclick="shareFileNative()" style="background:linear-gradient(135deg,#25d366,#16a34a);color:#fff;border:none;border-radius:8px;padding:12px;font-weight:800;font-size:14px;width:100%;cursor:pointer;font-family:inherit">📲 Share File (Save to Drive / Files)</button>'
      +'<div style="font-size:11px;color:#8eb4ff;margin-top:5px">Opens Android share sheet → save to Google Drive or Files</div>'
      +'</div>'

      // Option 2: Download link tap
      +'<div style="background:rgba(255,255,255,.08);border-radius:9px;padding:12px;margin-bottom:10px">'
      +'<div style="color:#8eb4ff;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:6px">OPTION 2 — TAP DOWNLOAD LINK</div>'
      +'<a href="'+dataUrl+'" download="'+fileName+'" id="dlLink"'
      +' style="display:block;background:#1e40af;color:#fff;padding:12px;border-radius:8px;text-align:center;font-weight:800;font-size:14px;text-decoration:none">'
      +'📥 Tap Here to Download</a>'
      +'</div>'

      // Option 3: Open in new tab
      +'<div style="background:rgba(255,255,255,.08);border-radius:9px;padding:12px">'
      +'<div style="color:#8eb4ff;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:6px">OPTION 3 — OPEN IN NEW TAB</div>'
      +'<button onclick="openNewTab()" style="background:#374151;color:#fff;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:13px;width:100%;cursor:pointer;font-family:inherit">🔗 Open File in New Tab → Save from browser</button>'
      +'<div style="font-size:11px;color:#8eb4ff;margin-top:5px">Opens file in browser → tap ⋮ → Download</div>'
      +'</div>'

      +'<div style="margin-top:10px;background:rgba(232,160,32,.15);border-radius:8px;padding:10px;font-size:12px;color:#e8a020;line-height:1.8">'
      +'<b>After saving file → upload to GitHub:</b><br>'
      +'github.com → your repo → <b>Add file → Upload files</b> → Commit ✅'
      +'</div>'
      +'</div>';

    // Store blob for share/tab options
    window._fileBlob=blob;
    window._fileName=fileName;
    window._dataUrl=dataUrl;
  };
  fr.onerror=function(){showMsg("exportMsg","❌ Could not prepare file","msg-err");};
  fr.readAsDataURL(blob);
}

function shareFileNative(){
  if(!window._fileBlob)return;
  var f=new File([window._fileBlob],window._fileName,{type:"text/html"});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({title:"ENTRIX App - Updated",files:[f]})
      .catch(function(e){if(e.name!=="AbortError")openNewTab();});
  }else{
    openNewTab();
  }
}

function openNewTab(){
  if(!window._dataUrl)return;
  var w=window.open(window._dataUrl,"_blank");
  if(!w){
    var a=document.createElement("a");
    a.href=window._dataUrl;
    a.target="_blank";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
}

function importPriceCode(){
  var ta=document.getElementById("importCodeTA");
  if(!ta||!ta.value.trim()){showMsg("importMsg","❌ Please paste the price code first","msg-err");return;}
  try{
    // Clean: remove ALL whitespace, newlines, spaces WhatsApp may have added
    var raw=ta.value
      .replace(/\s/g,"")        // remove all whitespace/newlines
      .replace(/[^A-Za-z0-9+/=]/g,""); // keep only valid base64 chars

    if(!raw){showMsg("importMsg","❌ Code is empty after cleaning. Please paste again.","msg-err");return;}

    // Decode base64
    var jsonStr=decodeURIComponent(escape(atob(raw)));
    var decoded=JSON.parse(jsonStr);

    if(decoded.p){prices=decoded.p;localStorage.setItem("ex_p",JSON.stringify(prices));}
    if(decoded.c){catalog=decoded.c;localStorage.setItem("ex_c",JSON.stringify(catalog));}
    if(decoded.u){localStorage.setItem("ex_user_cats",JSON.stringify(decoded.u));}
    if(decoded.pin){adminPin=decoded.pin;localStorage.setItem("ex_pin",adminPin);}
    if(decoded.m!=null){gMargin=parseFloat(decoded.m)||0;localStorage.setItem("ex_m",String(gMargin));}

    ta.value="";

    // Reload user cats into memory
    var uc=JSON.parse(localStorage.getItem("ex_user_cats")||"[]");
    uc.forEach(function(c){CAT_CLR[c.key]=c.color;CAT_ICO[c.key]=c.icon;CAT_LBL[c.key]=c.label;if(!prices[c.key])prices[c.key]=[];});

    // Show success with reload prompt
    var msgEl=document.getElementById("importMsg");
    if(msgEl){
      msgEl.innerHTML='<div class="msg msg-ok" style="text-align:left">'
        +'✅ <b>Prices imported successfully!</b><br>'
        +'<span style="font-size:12px">All products updated. Tap below to refresh.</span><br>'
        +'<button onclick="location.reload()" style="background:#15803d;color:#fff;border:none;border-radius:7px;'
        +'padding:9px 16px;font-weight:700;margin-top:8px;cursor:pointer;font-size:13px;font-family:inherit">🔄 Reload App</button>'
        +'</div>';
    }
  }catch(e){
    // Show what went wrong to help debug
    showMsg("importMsg","❌ Invalid code. Make sure you copied the FULL code without missing any characters. Error: "+e.message,"msg-err");
  }
}

async function shareWA(){
  const qno=(V("quoteNo")||"ENTRIX").split("/").join("-");
  const msgEl=document.getElementById("quoteMsg");
  if(msgEl)msgEl.innerHTML='<div style="text-align:center;padding:10px;color:#1e40af;font-weight:700">⏳ Generating PDF…</div>';

  try{
    // Load html2canvas
    if(typeof html2canvas==="undefined"){
      await new Promise((res,rej)=>{
        const s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
        s.onload=res; s.onerror=rej; document.head.appendChild(s);
      });
    }
    // Load jsPDF
    if(typeof window.jspdf==="undefined"){
      await new Promise((res,rej)=>{
        const s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
        s.onload=res; s.onerror=rej; document.head.appendChild(s);
      });
    }

    // Render preview
    renderPreview();
    showTab("preview");
    if(msgEl)msgEl.innerHTML='<div style="text-align:center;padding:10px;color:#1e40af;font-weight:700">📄 Rendering quotation…</div>';
    await new Promise(r=>setTimeout(r,800));

    const docEl=document.getElementById("quote-doc");
    if(!docEl){
      if(msgEl)msgEl.innerHTML='';
      showMsg("quoteMsg","❌ Preview not found — go to Preview tab first","msg-err");
      return;
    }

    if(msgEl)msgEl.innerHTML='<div style="text-align:center;padding:10px;color:#1e40af;font-weight:700">📸 Capturing layout…</div>';
    const canvas=await html2canvas(docEl,{
      scale:2.5, useCORS:true, allowTaint:true, backgroundColor:"#ffffff", logging:false, windowWidth:800,
      onclone:(doc)=>{ doc.querySelectorAll("#pdfMsg,#quoteMsg,.no-print").forEach(el=>el.style.display="none"); }
    });

    if(msgEl)msgEl.innerHTML='<div style="text-align:center;padding:10px;color:#1e40af;font-weight:700">📋 Building PDF…</div>';
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    const imgW=210, pageH=295;
    const imgH=(canvas.height*imgW)/canvas.width;
    if(imgH<=pageH){
      pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",0,0,imgW,imgH);
    }else{
      let yo=0;
      while(yo<imgH){
        const sy=(yo/imgH)*canvas.height;
        const sh=Math.min((pageH/imgH)*canvas.height,canvas.height-sy);
        const pc=document.createElement("canvas");
        pc.width=canvas.width; pc.height=sh;
        pc.getContext("2d").drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
        if(yo>0)pdf.addPage();
        pdf.addImage(pc.toDataURL("image/jpeg",0.92),"JPEG",0,0,imgW,Math.min(pageH,imgH-yo));
        yo+=pageH;
      }
    }

    const pdfBlob=pdf.output("blob");
    const defaultName=qno+"_ENTRIX";

    // Try direct Web Share API with PDF (works on Android Chrome from HTTPS)
    const pdfFileTest=new File([pdfBlob],defaultName+".pdf",{type:"application/pdf"});
    const canDirectShare=navigator.share&&navigator.canShare&&navigator.canShare({files:[pdfFileTest]});

    if(canDirectShare){
      // Direct share — Android share sheet opens
      if(msgEl)msgEl.innerHTML='';
      await navigator.share({
        title:"Quotation — ENTRIX INNOVATION",
        files:[pdfFileTest]
      });
      showMsg("quoteMsg","✅ PDF shared successfully!","msg-ok");
      return;
    }

    // Fallback — show download button + WhatsApp button
    const url=URL.createObjectURL(pdfBlob);
    const dlId="dl_"+Date.now();
    if(msgEl){
      msgEl.innerHTML='<div style="background:#0a1f4e;border-radius:12px;padding:14px;margin-top:6px">'
        +'<div style="font-weight:800;color:#e8a020;font-size:14px;margin-bottom:10px">📄 PDF Ready — 2 Steps:</div>'
        +'<div style="margin-bottom:8px">'
        +'<div style="color:#8eb4ff;font-size:11px;font-weight:700;margin-bottom:5px">📝 FILE NAME</div>'
        +'<input id="pdfFN" value="'+defaultName+'" style="width:100%;padding:9px;border:1.5px solid #e8a020;border-radius:7px;background:#1a3a7c;color:#fff;font-size:13px;font-weight:700;box-sizing:border-box;font-family:inherit;margin-bottom:8px">'
        +'<a id="'+dlId+'" href="'+url+'" download="'+defaultName+'.pdf" onclick="applyPdfName(this)"'
        +' style="display:block;background:#1e40af;color:#fff;padding:13px;border-radius:9px;text-align:center;font-weight:800;font-size:15px;text-decoration:none;margin-bottom:6px">'
        +'① 📥 TAP HERE TO SAVE PDF</a>'
        +'</div>'
        +'<a href="https://wa.me/" target="_blank"'
        +' style="display:block;background:linear-gradient(135deg,#25d366,#16a34a);color:#fff;padding:13px;border-radius:9px;text-align:center;font-weight:800;font-size:15px;text-decoration:none;margin-bottom:8px">'
        +'② 📲 OPEN WHATSAPP</a>'
        +'<div style="font-size:11px;color:#8eb4ff;line-height:1.8">'
        +'In WhatsApp → tap <b>📎</b> → <b>Document</b> → <b>Downloads</b> → select PDF → Send ✅'
        +'</div>'
        +'</div>';
    }

  }catch(err){
    if(msgEl)msgEl.innerHTML='';
    if(err&&err.name==="AbortError")return;
    console.error("PDF error:",err);
    showMsg("quoteMsg","❌ PDF failed: "+err.message,"msg-err");
  }
}

const APP_VERSION = "v" + DP_VERSION;

function checkVersion(){
  const stored = localStorage.getItem("ex_app_version");
  if(stored && stored !== APP_VERSION){
    // New version detected — show update bar
    const bar = document.createElement("div");
    bar.className = "update-notice";
    bar.id = "updateBar";
    bar.innerHTML = `⚡ New version loaded (${APP_VERSION}). Old version was ${stored}. &nbsp;<button onclick="hardRefresh()">🔄 Reload Now</button><button onclick="dismissUpdate()" style="background:rgba(0,0,0,.2);color:#fff;margin-left:6px">✕</button>`;
    document.body.appendChild(bar);
  }
  localStorage.setItem("ex_app_version", APP_VERSION);
}

function hardRefresh(){
  // Clear all caches and reload
  if('caches' in window){
    caches.keys().then(names => names.forEach(n => caches.delete(n)));
  }
  // Force reload bypassing cache
  window.location.reload(true);
}

function dismissUpdate(){
  const bar = document.getElementById("updateBar");
  if(bar) bar.remove();
}

// Force browser to always read fresh file (no cache)
(function(){

  if(html) html.setAttribute("data-version", APP_VERSION);

function exportToExcel(){
  try{
    // Build CSV data with all price master items
    var rows=[["Category","Product ID","Product Name","Rate (₹)","Description"]];

    Object.keys(prices).forEach(function(cat){
      var catLabel=CAT_LBL[cat]||cat;
      var items=prices[cat]||[];
      items.forEach(function(item){
        var desc=(item.desc||"").replace(/,/g," |").replace(/"/g,"'");
        var label=(item.label||"").replace(/,/g," |").replace(/"/g,"'");
        rows.push([catLabel, item.id, label, item.rate||0, desc]);
      });
      // Add blank row between categories
      rows.push(["","","","",""]);
    });

    // Also add catalog items
    rows.push(["--- CUSTOM CATALOG ---","","","",""]);
    catalog.forEach(function(cp){
      var desc=(cp.desc||"").replace(/,/g," |").replace(/"/g,"'");
      var name=(cp.name||"").replace(/,/g," |").replace(/"/g,"'");
      rows.push(["Custom Catalog", cp.id, name, cp.rate||0, desc]);
    });

    // Convert to CSV
    var csv=rows.map(function(r){
      return r.map(function(cell){
        var s=String(cell||"");
        // Wrap in quotes if contains comma or newline
        if(s.indexOf(",")>-1||s.indexOf("\n")>-1){s='"'+s+'"';}
        return s;
      }).join(",");
    }).join("\n");

    // Add BOM for Excel UTF-8 support (shows ₹ correctly)
    var bom="\uFEFF";
    var blob=new Blob([bom+csv],{type:"text/csv;charset=utf-8"});

    var date=new Date();
    var stamp=date.getFullYear()+""+String(date.getMonth()+1).padStart(2,"0")+""+String(date.getDate()).padStart(2,"0");
    var fileName="ENTRIX_Price_List_"+stamp+".csv";

    // Try Web Share first
    if(navigator.share&&navigator.canShare){
      var f=new File([blob],fileName,{type:"text/csv"});
      if(navigator.canShare({files:[f]})){
        navigator.share({title:"ENTRIX Price List",files:[f]})
          .then(function(){showMsg("excelMsg","✅ Shared!","msg-ok");})
          .catch(function(e){if(e.name!=="AbortError")downloadCSV(blob,fileName);});
        return;
      }
    }
    downloadCSV(blob,fileName);
  }catch(err){
    showMsg("excelMsg","❌ "+err.message,"msg-err");
  }
}

function downloadCSV(blob,fileName){
  var fr=new FileReader();
  fr.onload=function(){
    var dataUrl=fr.result;
    var msgEl=document.getElementById("excelMsg");
    if(!msgEl)return;

    // Create actual anchor element and append to DOM
    var dlId="csvDlLink_"+Date.now();
    msgEl.innerHTML='<div style="background:#dcfce7;border:2px solid #16a34a;border-radius:9px;padding:12px;margin-top:6px">'
      +'<div style="font-weight:800;color:#14532d;font-size:14px;margin-bottom:8px">✅ Excel File Ready!</div>'
      +'<a id="'+dlId+'" href="'+dataUrl+'" download="'+fileName+'"'
      +' style="display:block;background:#15803d;color:#fff;padding:13px;border-radius:8px;'
      +'text-align:center;font-weight:800;font-size:16px;text-decoration:none;margin-bottom:8px">'

  fr.readAsDataURL(blob);
}

// Register Service Worker for offline support
function registerSW(){
  if(!("serviceWorker" in navigator))return;
  var swCode=[
    'var CACHE="entrix-v2";',
    'var FILES=["/"];',
    'self.addEventListener("install",function(e){',
    '  e.waitUntil(caches.open(CACHE).then(function(c){return c.addAll(FILES);}));',
    '  self.skipWaiting();',
    '});',
    'self.addEventListener("activate",function(e){',
    '  e.waitUntil(caches.keys().then(function(keys){',
    '    return Promise.all(keys.filter(function(k){return k!==CACHE;}).map(function(k){return caches.delete(k);}));',
    '  }));',
    '  self.clients.claim();',
    '});',
    'self.addEventListener("fetch",function(e){',
    '  e.respondWith(caches.match(e.request).then(function(r){',
    '    return r||fetch(e.request).then(function(res){',
    '      var rc=res.clone();',
    '      caches.open(CACHE).then(function(c){c.put(e.request,rc);});',
    '      return res;',
    '    }).catch(function(){return caches.match("/");});',
    '  }));',
    '});'
  ].join('');
  var blob=new Blob([swCode],{type:"application/javascript"});
  var swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(function(){});
}
